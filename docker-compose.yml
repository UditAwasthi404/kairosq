services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    ports:
      - "5432:5432"
    volumes:
      - kairos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      PORT: "3000"
      NODE_ENV: development
      DATABASE_URL: postgresql://kairos:kairos@db:5432/kairos
      DIRECT_URL: postgresql://kairos:kairos@db:5432/kairos
      STORAGE_PROVIDER: local
      STORAGE_ROOT: /data/storage
      CORS_ORIGINS: http://localhost:3001
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - kairos-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  kairos-pg:
  kairos-storage:
